spring:
  application:
    name: citizen-registry

datasource:
  url: jdbc:postgresql://localhost:5432/citizen_registry
  username: app_user
  password: app_password
  driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html